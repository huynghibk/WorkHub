services:
  - type: web
    name: workhub-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: WORKHUB_DATA_DIR
        value: /data
      - key: WORKHUB_JWT_SECRET
        generateValue: true
      # Bắt buộc để data không mất khi redeploy (Neon free / Render Postgres).
      # Dashboard → Environment → dán connection string Neon vào DATABASE_URL.
      - key: DATABASE_URL
        sync: false
