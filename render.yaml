services:
  - type: web
    name: workhub-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: WORKHUB_DATA_DIR
        value: /data
      - key: WORKHUB_JWT_SECRET
        generateValue: true
      # Bắt buộc để data không mất khi redeploy (Neon free / Render Postgres).
      # Dashboard → Environment → dán connection string Neon vào DATABASE_URL.
      - key: DATABASE_URL
        sync: false
      # Gửi mã xác thực đăng ký. Gmail: smtp.gmail.com / 587 / App Password.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
